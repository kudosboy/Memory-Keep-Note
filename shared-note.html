<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#11111d">
  <title>Shared note · Memory Keep Note</title>
  <script src="/site-content.js" defer></script>
  <style>
    * { box-sizing: border-box; }
    body { min-height:100vh; margin:0; padding:24px; display:grid; place-items:center; background:#0b0b14; color:#f2f3ff; font:16px/1.7 ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif; }
    main { width:min(820px,100%); min-height:65vh; padding:clamp(22px,6vw,54px); border:1px solid rgba(255,255,255,.14); border-radius:24px; background:#171724; box-shadow:0 20px 70px rgba(0,0,0,.4); }
    h1 { margin:0 0 26px; font-size:clamp(26px,5vw,42px); line-height:1.2; overflow-wrap:anywhere; }
    #content { overflow-wrap:anywhere; }
    #content img { display:block; max-width:100%; max-height:70vh; height:auto; margin:18px 0; border-radius:14px; object-fit:contain; }
    #content a { color:#c6bbff; }
    #state { color:rgba(242,243,255,.65); }
    @media (max-width:560px) { body { padding:12px; } main { min-height:80vh; border-radius:18px; } }
    @media (prefers-reduced-motion:reduce) { *,*::before,*::after { scroll-behavior:auto !important; } }
  </style>
</head>
<body>
  <main id="note">
    <p id="state" role="status">Loading shared note…</p>
    <h1 id="title" hidden></h1>
    <article id="content"></article>
  </main>
  <script>
    (async () => {
      const state = document.querySelector("#state");
      const token = new URLSearchParams(location.search).get("token") || "";
      if (!/^[A-Za-z0-9_-]{40,60}$/.test(token)) {
        state.textContent = "This shared note link is invalid or has been turned off.";
        return;
      }
      try {
        const response = await fetch("/api/shared/" + encodeURIComponent(token), { cache: "no-store" });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(result.error || "This shared note is unavailable.");
        const title = document.querySelector("#title");
        const content = document.querySelector("#content");
        title.textContent = result.title || "Untitled note";
        title.hidden = false;
        content.innerHTML = result.content || "";
        content.querySelectorAll("img").forEach(image => {
          const match = /^\/api\/note-images\/([a-f0-9]{24})$/i.exec(image.getAttribute("src") || "");
          if (!match) image.remove();
          else image.src = "/api/shared/" + encodeURIComponent(token) + "/images/" + match[1];
        });
        if (/^#[0-9a-f]{6}$/i.test(result.color || "")) {
          const color = result.color;
          const r = parseInt(color.slice(1, 3), 16);
          const g = parseInt(color.slice(3, 5), 16);
          const b = parseInt(color.slice(5, 7), 16);
          document.querySelector("#note").style.backgroundColor = `rgba(${r},${g},${b},.23)`;
        }
        state.textContent = "Shared read-only";
      } catch (error) {
        state.textContent = error.message;
      }
    })();
  </script>
</body>
</html>
