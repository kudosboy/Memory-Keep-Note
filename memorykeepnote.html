    attachmentBtn: $("#attachmentBtn"),
    attachmentInput: $("#attachmentInput"),
    attachmentList: $("#attachmentList"),
    storageMeter: $("#storageMeter"),
    storageLabel: $("#storageLabel"),
    storageFill: $("#storageFill"),
    storageTrack: $("#storageTrack"),
    linkBtn: $("#linkBtn"),
    checklistBtn: $("#checklistBtn"),
    tableBtn: $("#tableBtn"),
  };

  let notes = [];
  let folders = [];
  let paidFeatures = new Set();
  let activeId = null;
  let query = "";
  let currentView = "all";
  let folderFilter = null;
  let tagFilter = null;
  let sortBy = "updated";
  let saveTimer = null;
  let stateTimer = null;
  let savedEditorRange = null;

  /* ---------------- Helpers ---------------- */

  const uid = () =>
    Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const escapeHtml = (value) => String(value).replace(/[&<>"']/g, (character) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
  })[character]);

  function safeNoteContent(markup) {
    const documentCopy = new DOMParser().parseFromString(`<body>${markup}</body>`, "text/html");
    const allowed = new Set(["P", "BR", "STRONG", "B", "EM", "I", "U", "S", "STRIKE", "H1", "H2", "H3", "BLOCKQUOTE", "PRE", "CODE", "UL", "OL", "LI", "A", "IMG", "TABLE", "THEAD", "TBODY", "TR", "TH", "TD", "INPUT"]);
    function clean(parent) {
      [...parent.childNodes].forEach(node => {
        if (node.nodeType !== Node.ELEMENT_NODE) return;
        if (!allowed.has(node.tagName)) {
          if (["SCRIPT", "STYLE", "IFRAME", "OBJECT", "SVG", "MATH"].includes(node.tagName)) node.remove();
          else node.replaceWith(...node.childNodes);
          return;
        }
        if (node.tagName === "IMG") {
          const src = node.getAttribute("src") || "";
          if (!/^\/api\/note-images\/[a-f0-9]{24}$/i.test(src)) {
            node.remove();
            return;
          }
          if (node.tagName === "INPUT") {
            if (node.getAttribute("type") !== "checkbox") {
              node.remove();
              return;
            }
            const checked = node.checked || node.hasAttribute("checked");
            [...node.attributes].forEach(attribute => node.removeAttribute(attribute.name));
            node.setAttribute("type", "checkbox");
            if (checked) node.setAttribute("checked", "");
            node.addEventListener("change", onEdit);
            return;
          }
          const alt = (node.getAttribute("alt") || "").slice(0, 200);
          [...node.attributes].forEach(attribute => node.removeAttribute(attribute.name));
          node.setAttribute("src", src);
          node.setAttribute("alt", alt);
          return;
        }
        if (node.tagName === "INPUT") {
          if (node.getAttribute("type") !== "checkbox") {
            node.remove();
            return;
          }
          const checked = node.checked || node.hasAttribute("checked");
          [...node.attributes].forEach(attribute => node.removeAttribute(attribute.name));
          node.setAttribute("type", "checkbox");
          if (checked) node.setAttribute("checked", "");
          return;
        }
        if (node.tagName === "A") {
          const href = node.getAttribute("href") || "";
          try {
            const parsed = new URL(href, location.origin);
            if (!["http:", "https:", "mailto:"].includes(parsed.protocol)) node.removeAttribute("href");
            else node.setAttribute("href", parsed.href);
          } catch { node.removeAttribute("href"); }
          [...node.attributes].forEach(attribute => {
            if (!["href", "target", "rel"].includes(attribute.name.toLowerCase())) node.removeAttribute(attribute.name);
          });
          node.setAttribute("rel", "noopener noreferrer");
        } else {
          [...node.attributes].forEach(attribute => node.removeAttribute(attribute.name));
        }
        clean(node);
      });
    }
    clean(documentCopy.body);
    return documentCopy.body.innerHTML;
  }

  function noteImageIds(markup) {
    const parsed = new DOMParser().parseFromString(`<body>${markup}</body>`, "text/html");
    return [...parsed.querySelectorAll("img")]
      .map(image => /^\/api\/note-images\/([a-f0-9]{24})$/i.exec(image.getAttribute("src") || "")?.[1])
      .filter(Boolean);
  }

  function renderDropdown(element, options, selected, onSelect) {
    const trigger = element.querySelector(".dropdown-trigger");
    const menu = element.querySelector(".dropdown-menu");
    const selectedOption = options.find((option) => option.value === selected) || options[0];
    trigger.querySelector(".dropdown-value").textContent = selectedOption.label;
    menu.replaceChildren();
    options.forEach((option) => {
      const item = document.createElement("button");
      item.type = "button";
      item.className = "dropdown-option";
      item.setAttribute("role", "option");
      item.setAttribute("aria-selected", String(option.value === selected));
      item.textContent = option.label;
      item.addEventListener("click", () => {
        closeDropdown(element);
        trigger.querySelector(".dropdown-value").textContent = option.label;
        menu.querySelectorAll("[role=\"option\"]").forEach((menuItem) => {
          menuItem.setAttribute("aria-selected", String(menuItem === item));
        });
        onSelect(option.value);
      });
      menu.appendChild(item);
    });
  }

  function closeDropdown(element, restoreFocus = false) {
    const trigger = element.querySelector(".dropdown-trigger");
    const menu = element.querySelector(".dropdown-menu");
    menu.hidden = true;
    trigger.setAttribute("aria-expanded", "false");
    if (restoreFocus) trigger.focus();
  }

  function openDropdown(element) {
    document.querySelectorAll(".dropdown").forEach((dropdown) => closeDropdown(dropdown));
    const trigger = element.querySelector(".dropdown-trigger");
    const menu = element.querySelector(".dropdown-menu");
    if (trigger.disabled) return;
    menu.hidden = false;
    trigger.setAttribute("aria-expanded", "true");
    menu.querySelector(".dropdown-option[aria-selected=\"true\"]")?.focus();
  }

  document.addEventListener("click", (event) => {
    if (!event.target.closest(".dropdown")) document.querySelectorAll(".dropdown").forEach((dropdown) => closeDropdown(dropdown));
  });
  document.addEventListener("keydown", (event) => {
    if (event.key !== "Escape") return;
    const open = document.querySelector(".dropdown-trigger[aria-expanded=\"true\"]");
    if (open) closeDropdown(open.closest(".dropdown"), true);
  });
  document.querySelectorAll(".dropdown").forEach((dropdown) => {
    const trigger = dropdown.querySelector(".dropdown-trigger");
    trigger.addEventListener("click", () => {
      if (trigger.getAttribute("aria-expanded") === "true") closeDropdown(dropdown);
      else openDropdown(dropdown);
    });
    trigger.addEventListener("keydown", (event) => {
      if (event.key === "ArrowDown" || event.key === "ArrowUp") {
        event.preventDefault();
        openDropdown(dropdown);
      }
    });
    dropdown.querySelector(".dropdown-menu").addEventListener("keydown", (event) => {
      if (event.key !== "ArrowDown" && event.key !== "ArrowUp") return;
      event.preventDefault();
      const options = [...dropdown.querySelectorAll(".dropdown-option")];
      const current = options.indexOf(document.activeElement);
      const offset = event.key === "ArrowDown" ? 1 : -1;
      options[(current + offset + options.length) % options.length]?.focus();
    });
  });

  function timeAgo(ts) {
    const diff = Date.now() - ts;
    const s = Math.floor(diff / 1000);
    if (s < 45) return "just now";
    const m = Math.floor(s / 60);
    if (m < 60) return m + "m ago";
    const h = Math.floor(m / 60);
    if (h < 24) return h + "h ago";
    const d = Math.floor(h / 24);
    if (d < 7) return d + "d ago";
    return new Date(ts).toLocaleDateString(undefined, { month: "short", day: "numeric" });
  }

  function activeNote() {
    return notes.find((n) => n.id === activeId) || null;
  }

  function colorTint(color, alpha = 0.22) {
    if (!/^#[0-9a-f]{6}$/i.test(color || "")) return "";
    const red = parseInt(color.slice(1, 3), 16);
    const green = parseInt(color.slice(3, 5), 16);
    const blue = parseInt(color.slice(5, 7), 16);
    return `rgba(${red}, ${green}, ${blue}, ${alpha})`;
  }

  function formatBytes(bytes) {
    if (bytes < 1024) return `${bytes} B`;
    const units = ["KB", "MB", "GB", "TB"];
    let value = bytes / 1024;
    let unit = 0;
    while (value >= 1024 && unit < units.length - 1) {
      value /= 1024;
      unit += 1;
    }
    return `${Math.abs(value - Math.round(value)) < 0.05 ? Math.round(value) : value >= 10 ? value.toFixed(0) : value.toFixed(1)} ${units[unit]}`;
  }

  function renderStorage(storage) {
    if (!storage) return;
    els.storageMeter.hidden = false;
    if (storage.unlimited || !storage.limitBytes) {
      els.storageLabel.textContent = `${formatBytes(storage.usedBytes)} · Unlimited`;
      els.storageTrack.hidden = true;
      return;
    }
    const percent = Math.min(100, storage.usedBytes / storage.limitBytes * 100);
    els.storageLabel.textContent = `${formatBytes(storage.usedBytes)} of ${formatBytes(storage.limitBytes)}`;
    els.storageFill.style.width = `${percent}%`;
    els.storageTrack.setAttribute("aria-valuenow", String(Math.round(percent)));
    els.storageTrack.setAttribute("aria-valuetext", `${formatBytes(storage.usedBytes)} of ${formatBytes(storage.limitBytes)}`);
    els.storageTrack.hidden = false;
  }
  window.addEventListener("mkn:storage-updated", (event) => renderStorage(event.detail));
  window.addEventListener("mkn:storage-error", () => {
    els.storageMeter.hidden = false;
    els.storageLabel.textContent = "Usage unavailable";
    els.storageTrack.hidden = true;
  });

  function applyNoteColor(note) {
    els.editor.style.background = note?.color
      ? `linear-gradient(${colorTint(note.color, 0.28)}, ${colorTint(note.color, 0.28)}), var(--panel)`
      : "";
    els.noteColor.value = /^#[0-9a-f]{6}$/i.test(note?.color || "") ? note.color : "#181824";
  }

  async function uploadNoteImage(noteId, file) {
    const response = await fetch("/api/notes/" + encodeURIComponent(noteId) + "/images", {
      method: "POST",
      headers: { "Content-Type": "application/octet-stream", "X-Image-Type": file.type },
      body: file
    });
    const result = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(result.error || "The picture could not be uploaded.");
    return result;
  }

  async function request(url, options = {}) {
    const response = await fetch(url, { ...options, headers: { "Content-Type": "application/json", ...(options.headers || {}) } });
    const result = response.status === 204 ? null : await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(result?.error || "Request failed. Please try again.");
    return result;
  }

  function renderAttachments(attachments, error = "") {
    els.attachmentList.replaceChildren();
    els.attachmentList.hidden = !error && !attachments.length;
    if (error) {
      const message = document.createElement("p");
      message.className = "attachment-error";
      message.setAttribute("role", "alert");
      message.textContent = error;
      els.attachmentList.appendChild(message);
      return;
    }
    attachments.forEach((attachment) => {
      const noteId = activeNote()?.id;
      const item = document.createElement("div");
      item.className = "attachment-item";
      const name = document.createElement("span");
      name.className = "attachment-name";
      name.textContent = attachment.fileName;
      const meta = document.createElement("span");
      meta.className = "attachment-meta";
      meta.textContent = `${attachment.contentType} · ${formatBytes(attachment.size)}`;
      const preview = document.createElement("a");
      preview.className = "attachment-action";
      preview.href = attachment.previewUrl;
      preview.target = "_blank";
      preview.rel = "noopener noreferrer";
      preview.textContent = "Preview";
      preview.setAttribute("aria-label", `Preview ${attachment.fileName}`);
      const download = document.createElement("a");
      download.className = "attachment-action";
      download.href = attachment.downloadUrl;
      download.textContent = "Download";
      download.setAttribute("aria-label", `Download ${attachment.fileName}`);
      item.append(name, meta, preview, download);
      if (attachment.contentType.startsWith("audio/")) {
        const player = document.createElement("audio");
        player.className = "attachment-player";
        player.controls = true;
        player.preload = "none";
        player.src = attachment.previewUrl;
        player.setAttribute("aria-label", `Play ${attachment.fileName}`);
        item.appendChild(player);
      }
      if (!activeNote()?.deletedAt) {
        const remove = document.createElement("button");
        remove.className = "attachment-action";
        remove.type = "button";
        remove.textContent = "Remove";
        remove.setAttribute("aria-label", `Remove ${attachment.fileName}`);
        remove.addEventListener("click", async () => {
          const note = activeNote();
          if (!note || note.id !== noteId) return;
          remove.disabled = true;
          try {
            const result = await request(`/api/notes/${encodeURIComponent(noteId)}/attachments/${encodeURIComponent(attachment.id)}`, { method: "DELETE", body: "{}" });
            if (result?.storage) renderStorage(result.storage);
            await refreshAttachments(noteId);
          } catch (error) {
            remove.disabled = false;
            renderAttachments(attachments, error.message);
          }
        });
        item.appendChild(remove);
      }
      els.attachmentList.appendChild(item);
    });
  }

  async function refreshAttachments(noteId) {
    const note = activeNote();
    if (!noteId || !note || note.id !== noteId || note.deletedAt) {
      renderAttachments([]);
      return;
    }
    try {
      const { attachments } = await request(`/api/notes/${encodeURIComponent(noteId)}/attachments`);
      if (activeNote()?.id === noteId) renderAttachments(attachments);
    } catch (error) {
      if (activeNote()?.id === noteId) {
        if (error.message === "Note not found.") renderAttachments([]);
        else renderAttachments([], `Attachments are temporarily unavailable: ${error.message}`);
      }
    }
  }

  async function flushNoteSync() {
    const note = activeNote();
    if (!note || note.deletedAt) throw new Error("Select an active note first.");
    note.title = els.titleInput.value;
    note.content = els.bodyInput.innerHTML;
    note.body = els.bodyInput.textContent || "";
    note.attachments = [...new Set(noteImageIds(note.content))];
    clearTimeout(saveTimer);
    persist();
    const result = await request("/api/notes/sync", { method: "POST", body: JSON.stringify({ notes }) });
    if (result?.storage) renderStorage(result.storage);
    renderList();
    updateStatus();
  }

  function visibleInView(note) {
    if (currentView === "trash") return !!note.deletedAt;
    if (note.deletedAt) return false;
    if (currentView === "archived") return !!note.isArchived;
    if (note.isArchived) return false;
    if (currentView === "pinned" && !note.isPinned) return false;
    if (currentView === "recent" && note.updated < Date.now() - 7 * 86400000) return false;
    if (currentView === "folder" && note.folderId !== folderFilter) return false;
    if (tagFilter && !(note.tags || []).includes(tagFilter)) return false;
    return true;
  }

  function setView(view, folderId = null, tag = null) {
    currentView = view;
    folderFilter = folderId;
    tagFilter = tag;
    els.viewList.querySelectorAll("[data-view]").forEach((button) => {
      button.classList.toggle("active", button.dataset.view === view && !tag);
    });
    els.folderList.querySelectorAll("[data-folder-id]").forEach((button) => {
      button.classList.toggle("active", button.dataset.folderId === folderId && view === "folder");
    });
    els.tagList.querySelectorAll("[data-tag]").forEach((button) => {
      button.classList.toggle("active", button.dataset.tag === tag);
    });
    renderList();
  }

  function updateOrganization() {
    const liveNotes = notes.filter((note) => !note.deletedAt);
    const count = (predicate) => notes.filter(predicate).length;
    $("#allCount").textContent = count((note) => !note.deletedAt && !note.isArchived);
    $("#pinnedCount").textContent = count((note) => !note.deletedAt && !note.isArchived && note.isPinned);
    $("#recentCount").textContent = count((note) => !note.deletedAt && !note.isArchived && note.updated >= Date.now() - 7 * 86400000);
    $("#archivedCount").textContent = count((note) => !note.deletedAt && note.isArchived);
    $("#trashCount").textContent = count((note) => !!note.deletedAt);

    els.folderList.replaceChildren();
    folders.forEach((folder) => {
      const row = document.createElement("div");
      row.className = "nav-row";
      const open = document.createElement("button");
      open.type = "button";
      open.className = "nav-item";
      open.dataset.folderId = folder.id;
      open.dataset.folderAction = "open";
      open.innerHTML = `<span aria-hidden="true">▰</span><span>${escapeHtml(folder.name)}</span><span class="nav-count">${count((note) => !note.deletedAt && !note.isArchived && note.folderId === folder.id)}</span>`;
      open.classList.toggle("active", currentView === "folder" && folderFilter === folder.id);
      const rename = document.createElement("button");
      rename.type = "button";
      rename.className = "nav-action";
      rename.dataset.folderId = folder.id;
      rename.dataset.folderAction = "rename";
      rename.setAttribute("aria-label", `Rename ${folder.name}`);
      rename.title = "Rename folder";
      rename.textContent = "…";
      const remove = document.createElement("button");
      remove.type = "button";
      remove.className = "nav-action";
      remove.dataset.folderId = folder.id;
      remove.dataset.folderAction = "delete";
      remove.setAttribute("aria-label", `Delete ${folder.name}`);
      remove.title = "Delete folder";
      remove.textContent = "×";
      const editForm = document.createElement("form");
      editForm.className = "inline-form";
      editForm.hidden = true;
      const label = document.createElement("label");
      label.textContent = "Folder name";
      const input = document.createElement("input");
      input.value = folder.name;
      input.maxLength = 60;
      input.required = true;
      label.appendChild(input);
      const actions = document.createElement("div");
      actions.className = "inline-form-actions";
      const save = document.createElement("button");
      save.type = "submit";
      save.textContent = "Save";
      const cancel = document.createElement("button");
      cancel.type = "button";
      cancel.textContent = "Cancel";
      cancel.addEventListener("click", () => { editForm.hidden = true; open.hidden = false; });
      actions.append(save, cancel);
      editForm.append(label, actions);
      editForm.addEventListener("submit", (event) => {
        event.preventDefault();
        const name = input.value.trim();
        if (!/^[\p{L}\p{N}][\p{L}\p{N} _-]{0,59}$/u.test(name)) {
          els.orgError.textContent = "Folder names must be 1 to 60 letters, numbers, spaces, underscores, or hyphens.";
          els.orgError.hidden = false;
          return;
        }
        requestFolderAction("rename", folder.id, name);
        editForm.hidden = true;
        open.hidden = false;
      });
      row.append(open, rename, remove, editForm);
      els.folderList.appendChild(row);
    });

    const tagCounts = new Map();
    liveNotes.forEach((note) => (note.tags || []).forEach((tag) => tagCounts.set(tag, (tagCounts.get(tag) || 0) + 1)));
    els.tagList.replaceChildren();
    [...tagCounts].sort(([a], [b]) => a.localeCompare(b)).forEach(([tag, total]) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "nav-item";
      button.dataset.tag = tag;
      button.innerHTML = `<span aria-hidden="true">#</span><span>${escapeHtml(tag)}</span><span class="nav-count">${total}</span>`;
      button.classList.toggle("active", tagFilter === tag);
      els.tagList.appendChild(button);
    });

    const selected = activeNote();
    const folderOptions = [{ value: "", label: "All Notes" }, ...folders.map((folder) => ({ value: folder.id, label: folder.name }))];
    renderDropdown(els.folderDropdown, folderOptions, selected && selected.folderId || "", (folderId) => {
      const note = activeNote();
      if (!note || note.deletedAt) return;
      note.folderId = folderId || null;
      note.updated = Date.now();
      persist();
      renderList();
      updateStatus();
      setSaveState("Moved");
    });
    els.noteCount.textContent = liveNotes.length + (liveNotes.length === 1 ? " note" : " notes");
  }

  /* ---------------- Storage ---------------- */

  function loadFromStorage() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const parsed = raw ? JSON.parse(raw) : [];
      notes = Array.isArray(parsed) ? parsed.filter((n) => n && n.id) : [];
    } catch (e) {
      notes = [];
    }
  }

  function persist() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(notes));
    } catch (e) {
      setSaveState("Storage full!", true);
    }
  }

  /* ---------------- UI ---------------- */

  function setSaveState(text, saving) {
    els.saveState.textContent = text;
    els.saveState.classList.toggle("saving", !!saving);
    clearTimeout(stateTimer);
    if (!saving) {
      stateTimer = setTimeout(() => {
        els.saveState.textContent = "Saved";
        els.saveState.classList.remove("saving");
      }, 2000);
    }
  }

  function updateStatus() {
    const note = activeNote();
    const body = note ? note.body : "";
    const words = body.trim() ? body.trim().split(/\s+/).length : 0;

    els.wordCount.textContent = words + (words === 1 ? " word" : " words");
    els.updatedAt.textContent = note ? "Edited " + timeAgo(note.updated) : "—";
    updateOrganization();
  }

  function renderList() {
    const q = query.trim().toLowerCase();
    const visible = notes
      .filter((n) => visibleInView(n) && (
        !q ||
        (
          (n.title || "").toLowerCase().includes(q) ||
          (n.body || "").toLowerCase().includes(q) ||
          (n.tags || []).some((tag) => tag.includes(q))
        )
      ))
      .sort((a, b) => sortBy === "title"
        ? (a.title || "").localeCompare(b.title || "")
        : sortBy === "created" ? b.created - a.created : b.updated - a.updated);

    els.visibleNoteCount.textContent = String(visible.length);
    els.notesList.innerHTML = "";

    if (!visible.length) {
      const empty = document.createElement("div");
      empty.className = "empty-list";
      empty.textContent = q ? "No notes match your search" : currentView === "trash" ? "Recently deleted notes will appear here." : tagFilter ? `No notes tagged “${tagFilter}”.` : "No notes in this view yet.";
      els.notesList.appendChild(empty);
      return;
    }

    const frag = document.createDocumentFragment();

    visible.forEach((n) => {
      const item = document.createElement("button");
      item.type = "button";
      item.className = "note-item" + (n.id === activeId ? " active" : "");
      item.dataset.id = n.id;
      if (n.color) item.style.backgroundColor = colorTint(n.color, n.id === activeId ? 0.25 : 0.14);

      const title = document.createElement("div");
      title.className = "ni-title";
      title.textContent = (n.isPinned ? "📌 " : "") + ((n.title || "").trim() || "Untitled note");

      const preview = document.createElement("div");
      preview.className = "ni-preview";
      const clean = (n.body || "").replace(/\s+/g, " ").trim();
      preview.textContent = clean ? clean.slice(0, 70) : "No content yet";

      const date = document.createElement("div");
      date.className = "ni-date";
      date.textContent = n.deletedAt ? "Deleted " + timeAgo(n.deletedAt) : timeAgo(n.updated);

      item.append(title, preview, date);
      if (n.tags && n.tags.length) {
        const tags = document.createElement("div");
        tags.className = "ni-date";
        tags.textContent = n.tags.map((tag) => "#" + tag).join("  ");
        item.appendChild(tags);
      }
      frag.appendChild(item);
    });

    els.notesList.appendChild(frag);
    updateOrganization();
  }

  function loadActiveIntoEditor() {
    const note = activeNote();
    const has = !!note;
    const trashed = has && !!note.deletedAt;

    els.titleInput.disabled = !has || trashed;
    els.bodyInput.contentEditable = has && !trashed ? "true" : "false";
    els.downloadBtn.disabled = !has;
    els.deleteBtn.disabled = !has;
    els.duplicateBtn.disabled = !has || trashed;
    els.pinBtn.disabled = !has || trashed;
    els.archiveBtn.disabled = !has || trashed;
    els.tagBtn.disabled = !has || trashed;
    els.shareBtn.disabled = !has || trashed || !paidFeatures.has("sharing");
    const canChangeColor = has && !trashed && paidFeatures.has("themes");
    els.noteColor.disabled = !canChangeColor;
    els.colorMenuBtn.disabled = !canChangeColor;
    els.imageBtn.disabled = !has || trashed || !paidFeatures.has("attachments");
    els.attachmentBtn.disabled = !has || trashed || !paidFeatures.has("attachments");
    if(!paidFeatures.has("sharing"))els.shareBtn.title="Plus feature · upgrade to share notes";else els.shareBtn.removeAttribute("title");
    if(!paidFeatures.has("themes"))els.noteColor.title="Plus feature · upgrade for custom colors";else els.noteColor.removeAttribute("title");
    if(!paidFeatures.has("attachments")){els.imageBtn.title="Plus feature · upgrade to add pictures";els.attachmentBtn.title="Plus feature · upgrade to attach files"}else{els.imageBtn.removeAttribute("title");els.attachmentBtn.removeAttribute("title")}
    els.folderDropdown.querySelector(".dropdown-trigger").disabled = !has || trashed;
    els.restoreBtn.hidden = !trashed;
    els.deleteBtn.title = trashed ? "Delete permanently" : "Move to Recently Deleted";
    els.deleteBtn.setAttribute("aria-label", els.deleteBtn.title);
    els.pinBtn.textContent = has && note.isPinned ? "Unpin" : "Pin";
    els.archiveBtn.textContent = has && note.isArchived ? "Unarchive" : "Archive";

    els.titleInput.value = has ? note.title : "";
    updateColorSwatch(els.noteColor.value);
    els.bodyInput.innerHTML = has ? safeNoteContent(note.content || escapeHtml(note.body || "")) : "";
    renderAttachments([]);
    if (has && !trashed) void refreshAttachments(note.id);
    applyNoteColor(note);
    els.sharePanel.hidden = true;
    els.shareBtn.setAttribute("aria-expanded", "false");
    els.shareUrl.value = "";

    els.titleInput.placeholder = has ? "Untitled note" : "No note selected";
    els.bodyInput.dataset.placeholder = has
      ? "Start writing… everything saves automatically."
      : "Create a new note to get started.";

    updateStatus();
  }

  function selectNote(id) {
    activeId = id;
    loadActiveIntoEditor();
    renderList();
    closeSidebar();
  }

  function createNote() {
    if (currentView === "trash" || currentView === "archived" || currentView === "pinned") setView("all");
    const now = Date.now();
    const note = { id: uid(), title: "", body: "", content: "", tags: tagFilter ? [tagFilter] : [], isPinned: false, isArchived: false, folderId: currentView === "folder" ? folderFilter : null, created: now, updated: now, version: 1 };
    notes.push(note);
    persist();

    activeId = note.id;
    els.titleInput.value = "";
    els.bodyInput.innerHTML = "";
    loadActiveIntoEditor();
    renderList();
    setSaveState("Saved");

    els.titleInput.focus();
    closeSidebar();
  }

  function deleteActiveNote() {
    const note = activeNote();
    if (!note) return;

    const label = (note.title || "").trim() || "this note";
    if (note.deletedAt) {
      if (!confirm(`Permanently delete “${label}”? This cannot be undone.`)) return;
      notes = notes.filter((n) => n.id !== activeId);
      setSaveState("Deleted permanently");
    } else {
      if (!confirm(`Move “${label}” to Recently Deleted? You can restore it later.`)) return;
      note.deletedAt = Date.now();
      setSaveState("Moved to Recently Deleted");
    }
    persist();

    const remaining = notes.filter((item) => visibleInView(item)).sort((a, b) => b.updated - a.updated);
    activeId = remaining.length ? remaining[0].id : null;

    loadActiveIntoEditor();
    renderList();
  }

  function restoreActiveNote() {
    const note = activeNote();
    if (!note || !note.deletedAt) return;
    delete note.deletedAt;
    note.updated = Date.now();
    persist();
    currentView = "all";
    activeId = note.id;
    loadActiveIntoEditor();
    renderList();
    setSaveState("Restored");
  }

  function duplicateActiveNote() {
    const note = activeNote();
    if (!note || note.deletedAt) return;
    const copy = { ...note, id: uid(), title: (note.title || "Untitled note") + " copy", tags: [...(note.tags || [])], attachments: [...(note.attachments || [])], created: Date.now(), updated: Date.now(), isPinned: false, deletedAt: null, version: 1 };
    notes.push(copy);
    activeId = copy.id;
    persist();
    loadActiveIntoEditor();
    renderList();
    setSaveState("Note duplicated");
  }

  function editTags() {
    const note = activeNote();
    if (!note || note.deletedAt) return;
    els.tagError.textContent = "";
    els.tagError.hidden = true;
    els.tagInput.value = (note.tags || []).join(", ");
    els.tagForm.hidden = !els.tagForm.hidden;
    if (!els.tagForm.hidden) els.tagInput.focus();
  }

  function saveTags(event) {
    event.preventDefault();
    const note = activeNote();
    if (!note || note.deletedAt) return;
    const tags = [...new Set(els.tagInput.value.split(",").map((tag) => tag.trim().toLowerCase()).filter(Boolean))];
    if (tags.length > 12 || tags.some((tag) => !/^[\p{L}\p{N}][\p{L}\p{N} _-]{0,31}$/u.test(tag))) {
      els.tagError.textContent = "Tags must be 1 to 32 letters, numbers, spaces, underscores, or hyphens; use no more than 12 tags.";
      els.tagError.hidden = false;
      return;
    }
    note.tags = tags;
    note.updated = Date.now();
    persist();
    els.tagForm.hidden = true;
    renderList();
    updateStatus();
    setSaveState("Tags saved");
  }

  function toggleNoteProperty(property, enabledText, disabledText) {
    const note = activeNote();
    if (!note || note.deletedAt) return;
    note[property] = !note[property];
    note.updated = Date.now();
    persist();
    loadActiveIntoEditor();
    renderList();
    setSaveState(note[property] ? enabledText : disabledText);
  }

  function requestFolderAction(action, folderId, name) {
    window.dispatchEvent(new CustomEvent("mkn:folder-action", { detail: { action, folderId, name } }));
  }

  function downloadActiveNote() {
    const note = activeNote();
    if (!note) return;

    const base = (note.title || "note")
      .replace(/[^\w\s-]/g, "")
      .trim()
      .replace(/\s+/g, "-")
      .slice(0, 60) || "note";

    const content =
      ((note.title || "").trim() ? note.title.trim() + "\n\n" : "") +
      note.body;

    const blob = new Blob([content], { type: "text/plain;charset=utf-8" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = base + ".txt";
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 1500);
  }

  /* ---------------- Editing ---------------- */

  function onEdit() {
    const note = activeNote();
    if (!note) return;

    note.title = els.titleInput.value;
    note.content = els.bodyInput.innerHTML;
    note.body = els.bodyInput.textContent || "";
    note.attachments = [...new Set(noteImageIds(note.content))];
    note.version = (note.version || 0) + 1;
    note.updated = Date.now();

    updateStatus();
    els.saveState.textContent = "Saving…";
    els.saveState.classList.add("saving");

    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => {
      persist();
      renderList();
      updateStatus();
      els.saveState.classList.remove("saving");
      els.saveState.textContent = "Saved";
    }, 400);
  }

  /* ---------------- Mobile sidebar ---------------- */

  function openSidebar() {
    els.sidebar.classList.add("open");
    els.scrim.classList.add("show");
  }
  function closeSidebar() {
    els.sidebar.classList.remove("open");
    els.scrim.classList.remove("show");
  }

  /* ---------------- Events ---------------- */

  els.newBtn.addEventListener("click", createNote);
  window.addEventListener("mkn:billing-updated", (event) => {
    paidFeatures = new Set(event.detail?.features || []);
    loadActiveIntoEditor();
  });
  els.deleteBtn.addEventListener("click", deleteActiveNote);
  els.downloadBtn.addEventListener("click", downloadActiveNote);
  els.duplicateBtn.addEventListener("click", duplicateActiveNote);
  els.restoreBtn.addEventListener("click", restoreActiveNote);
  els.pinBtn.addEventListener("click", () => toggleNoteProperty("isPinned", "Pinned", "Unpinned"));
  els.archiveBtn.addEventListener("click", () => toggleNoteProperty("isArchived", "Archived", "Unarchived"));
  els.tagBtn.addEventListener("click", editTags);
  els.shareBtn.addEventListener("click", async () => {
    const note = activeNote();
    if (!note || note.deletedAt) return;
    els.sharePanel.hidden = !els.sharePanel.hidden;
    els.shareBtn.setAttribute("aria-expanded", String(!els.sharePanel.hidden));
    els.shareError.hidden = true;
    if (els.sharePanel.hidden) return;
    try {
      await flushNoteSync();
      const { shared, url } = await request("/api/notes/" + encodeURIComponent(note.id) + "/share");
      if (activeId !== note.id) return;
      els.shareUrl.value = shared ? url : "";
      els.createShareBtn.textContent = shared ? "Copy link" : "Create link";
      els.createShareBtn.hidden = shared;
      els.copyShareBtn.hidden = !shared;
      els.revokeShareBtn.hidden = !shared;
    } catch (error) {
      els.shareError.textContent = error.message;
      els.shareError.hidden = false;
    }
  });
  els.createShareBtn.addEventListener("click", async () => {
    const note = activeNote();
    if (!note || note.deletedAt) return;
    try {
      const { url } = await request("/api/notes/" + encodeURIComponent(note.id) + "/share", { method: "POST", body: "{}" });
      if (activeId !== note.id) return;
      els.shareUrl.value = url;
      els.createShareBtn.hidden = true;
      els.copyShareBtn.hidden = false;
      els.revokeShareBtn.hidden = false;
      setSaveState("Read-only link ready");
    } catch (error) {
      els.shareError.textContent = error.message;
      els.shareError.hidden = false;
    }
  });
  els.copyShareBtn.addEventListener("click", async () => {
    try {
      await navigator.clipboard.writeText(els.shareUrl.value);
      setSaveState("Share link copied");
    } catch (error) {
      els.shareUrl.select();
      els.shareError.textContent = "Copy was blocked by the browser. Select the link above and copy it.";
      els.shareError.hidden = false;
    }
  });
  els.revokeShareBtn.addEventListener("click", async () => {
    const note = activeNote();
    if (!note || !confirm("Turn off sharing? Anyone using the current link will lose access.")) return;
    try {
      await request("/api/notes/" + encodeURIComponent(note.id) + "/share", { method: "DELETE", body: "{}" });
      els.shareUrl.value = "";
      els.copyShareBtn.hidden = true;
      els.revokeShareBtn.hidden = true;
      els.createShareBtn.hidden = false;
      els.createShareBtn.textContent = "Create link";
      setSaveState("Sharing turned off");
    } catch (error) {
      els.shareError.textContent = error.message;
      els.shareError.hidden = false;
    }
  });
  function updateColorSwatch(color) {
    els.colorSwatch.style.setProperty("--selected-color", color);
    els.colorPalette.querySelectorAll(".color-choice").forEach((choice) => {
      choice.setAttribute("aria-pressed", String(choice.dataset.color === color.toLowerCase()));
    });
  }

  function closeColorPalette() {
    els.colorPalette.hidden = true;
    els.colorMenuBtn.setAttribute("aria-expanded", "false");
  }

  function saveNoteColor(color) {
    const note = activeNote();
    if (!note || note.deletedAt || !/^#[0-9a-f]{6}$/i.test(color)) return;
    note.color = color.toLowerCase();
    els.noteColor.value = note.color;
    updateColorSwatch(note.color);
    applyNoteColor(note);
    onEdit();
  }

  els.colorMenuBtn.addEventListener("click", () => {
    const open = els.colorPalette.hidden;
    els.colorPalette.hidden = !open;
    els.colorMenuBtn.setAttribute("aria-expanded", String(open));
  });
  els.colorPalette.querySelectorAll(".color-choice").forEach((choice) => {
    choice.addEventListener("click", () => {
      saveNoteColor(choice.dataset.color);
      closeColorPalette();
      els.colorMenuBtn.focus();
    });
  });
  els.noteColor.addEventListener("change", () => {
    saveNoteColor(els.noteColor.value);
    closeColorPalette();
    els.colorMenuBtn.focus();
  });
  document.addEventListener("click", (event) => {
    if (!els.colorPalette.hidden && !event.target.closest("#colorPalette, #colorMenuBtn")) closeColorPalette();
  });
  document.addEventListener("keydown", (event) => {
    if (event.key === "Escape" && !els.colorPalette.hidden) {
      closeColorPalette();
      els.colorMenuBtn.focus();
    }
  });
  els.imageBtn.addEventListener("click", () => {
    const selection = window.getSelection();
    savedEditorRange = selection && selection.rangeCount ? selection.getRangeAt(0).cloneRange() : null;
    els.imageInput.click();
  });
  els.imageInput.addEventListener("change", async () => {
    const file = els.imageInput.files?.[0];
    const note = activeNote();
    els.imageInput.value = "";
    if (!file || !note || note.deletedAt) return;
    if (!["image/png", "image/jpeg", "image/webp", "image/gif"].includes(file.type) || file.size > 5 * 1024 * 1024) {
      alert("Choose a PNG, JPEG, WebP, or GIF image up to 5 MB.");
      return;
    }
    try {
      setSaveState("Uploading picture…", true);
      await flushNoteSync();
      const result = await uploadNoteImage(note.id, file);
      if (activeId !== note.id) throw new Error("The picture uploaded, but the selected note changed. Reopen the original note to insert it.");
      note.attachments = [...new Set([...(note.attachments || []), result.id])];
      const image = document.createElement("img");
      image.src = result.url;
      image.alt = file.name.slice(0, 200);
      const selection = window.getSelection();
      if (savedEditorRange && els.bodyInput.contains(savedEditorRange.commonAncestorContainer)) {
        selection.removeAllRanges();
        selection.addRange(savedEditorRange);
      } else {
        els.bodyInput.focus();
        const range = document.createRange();
        range.selectNodeContents(els.bodyInput);
        range.collapse(false);
        selection.removeAllRanges();
        selection.addRange(range);
      }
      const range = selection.getRangeAt(0);
      range.deleteContents();
      range.insertNode(image);
      range.setStartAfter(image);
      range.collapse(true);
      selection.removeAllRanges();
      selection.addRange(range);
      els.bodyInput.focus();
      onEdit();
    } catch (error) {
      els.saveState.textContent = error.message;
      els.saveState.classList.remove("saving");
    }
  });
  els.attachmentBtn.addEventListener("click", () => els.attachmentInput.click());
  els.attachmentInput.addEventListener("change", async () => {
    const file = els.attachmentInput.files?.[0];
    const note = activeNote();
    els.attachmentInput.value = "";
    if (!file || !note || note.deletedAt) return;
    const extension = file.name.toLowerCase().slice(file.name.lastIndexOf("."));
    const fileTypes = { ".pdf": "application/pdf", ".txt": "text/plain", ".csv": "text/csv", ".webm": "audio/webm", ".mp4": "audio/mp4", ".m4a": "audio/mp4", ".mp3": "audio/mpeg" };
    const contentType = fileTypes[extension];
    if (!contentType || file.size > 20 * 1024 * 1024) {
      alert("Choose a PDF, TXT, CSV, WebM, MP4/M4A, or MP3 file up to 20 MB.");
      return;
    }
    try {
      setSaveState("Uploading attachment…", true);
      await flushNoteSync();
      const response = await fetch(`/api/notes/${encodeURIComponent(note.id)}/attachments`, {
        method: "POST",
        headers: { "Content-Type": "application/octet-stream", "X-File-Type": contentType, "X-File-Name": encodeURIComponent(file.name) },
        body: file
      });
      const result = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(result.error || "The attachment could not be uploaded.");
      if (result?.storage) renderStorage(result.storage);
      if (activeNote()?.id === note.id) await refreshAttachments(note.id);
      setSaveState("Attachment added");
    } catch (error) {
      els.saveState.textContent = error.message;
      els.saveState.classList.remove("saving");
    }
  });
  els.addFolderBtn.addEventListener("click", () => {
    els.orgError.textContent = "";
    els.orgError.hidden = true;
    els.folderForm.hidden = false;
    els.folderName.focus();
  });
  els.folderForm.addEventListener("submit", (event) => {
    event.preventDefault();
    const name = els.folderName.value.trim();
    if (!/^[\p{L}\p{N}][\p{L}\p{N} _-]{0,59}$/u.test(name)) {
      els.orgError.textContent = "Folder names must be 1 to 60 letters, numbers, spaces, underscores, or hyphens.";
      els.orgError.hidden = false;
      return;
    }
    requestFolderAction("create", null, name);
    els.folderName.value = "";
    els.folderForm.hidden = true;
  });
  els.cancelFolderBtn.addEventListener("click", () => { els.folderForm.hidden = true; els.folderName.value = ""; });
  els.tagForm.addEventListener("submit", saveTags);
  els.cancelTagBtn.addEventListener("click", () => { els.tagForm.hidden = true; els.tagError.hidden = true; });
  els.folderList.addEventListener("click", (event) => {
    const button = event.target.closest("[data-folder-action]");
    if (!button) return;
    const folder = folders.find((item) => item.id === button.dataset.folderId);
    if (!folder) return;
    const action = button.dataset.folderAction;
    if (action === "open") {
      setView("folder", folder.id);
      return;
    }
    if (action === "rename") {
      const row = button.closest(".nav-row");
      const form = row.querySelector("form");
      button.closest(".nav-row").querySelector(".nav-item").hidden = true;
      form.hidden = false;
      form.querySelector("input").focus();
      return;
    }
    if (action === "delete" && confirm(`Delete folder “${folder.name}”? Its notes will be moved to All Notes.`)) {
      requestFolderAction("delete", folder.id);
    }
  });
  els.viewList.addEventListener("click", (event) => {
    const button = event.target.closest("[data-view]");
    if (button) setView(button.dataset.view);
  });
  els.tagList.addEventListener("click", (event) => {
    const button = event.target.closest("[data-tag]");
    if (button) setView("all", null, button.dataset.tag);
  });
  renderDropdown(els.sortDropdown, [
    { value: "updated", label: "Sort: Recently Edited" },
    { value: "created", label: "Sort: Date Created" },
    { value: "title", label: "Sort: Title" },
  ], sortBy, (value) => { sortBy = value; renderList(); });
  window.addEventListener("mkn:folders-updated", (event) => {
    folders = Array.isArray(event.detail) ? event.detail : [];
    els.orgError.textContent = "";
    els.orgError.hidden = true;
    if (currentView === "folder" && !folders.some((folder) => folder.id === folderFilter)) {
      setView("all");
      return;
    }
    updateOrganization();
    renderList();
  });
  window.addEventListener("mkn:folder-deleted", (event) => {
    notes.forEach((note) => { if (note.folderId === event.detail) note.folderId = null; });
    persist();
    renderList();
    updateStatus();
  });
  window.addEventListener("mkn:folder-action-error", (event) => {
    els.orgError.textContent = event.detail || "The folder could not be updated. Please try again.";
    els.orgError.hidden = false;
  });

  els.titleInput.addEventListener("input", onEdit);
  els.bodyInput.addEventListener("input", onEdit);
  document.querySelectorAll("[data-format]").forEach((button) => {
    button.addEventListener("pointerdown", (event) => event.preventDefault());
    button.addEventListener("click", () => {
      els.bodyInput.focus();
      const command = button.dataset.format;
      const value = command === "formatBlock" ? `<${button.dataset.value}>` : button.dataset.value || null;
      document.execCommand(command, false, value);
      onEdit();
    });
  });
  els.linkBtn.addEventListener("pointerdown", (event) => event.preventDefault());
  els.linkBtn.addEventListener("click", () => {
    const href = prompt("Enter a web or email link:");
    if (!href) return;
    let safeHref;
    try {
      const parsed = new URL(href, location.origin);
      if (!["http:", "https:", "mailto:"].includes(parsed.protocol)) throw new Error();
      safeHref = parsed.href;
    } catch {
      alert("Enter a valid http, https, or mailto link.");
      return;
    }
    els.bodyInput.focus();
    document.execCommand("createLink", false, safeHref);
    onEdit();
  });
  els.checklistBtn.addEventListener("pointerdown", (event) => event.preventDefault());
  els.checklistBtn.addEventListener("click", () => {
    els.bodyInput.focus();
    document.execCommand("insertHTML", false, "<ul><li><input type=\"checkbox\"> </li></ul><p><br></p>");
    onEdit();
  });
  els.tableBtn.addEventListener("pointerdown", (event) => event.preventDefault());
  els.tableBtn.addEventListener("click", () => {
    els.bodyInput.focus();
    document.execCommand("insertHTML", false, "<table><tbody><tr><td><br></td><td><br></td></tr><tr><td><br></td><td><br></td></tr></tbody></table><p><br></p>");
    onEdit();
  });
  els.bodyInput.addEventListener("change", (event) => {
    if (event.target.matches("input[type=checkbox]")) {
      event.target.toggleAttribute("checked", event.target.checked);
      onEdit();
    }
  });

  els.search.addEventListener("input", (e) => {
    query = e.target.value;
    renderList();
  });

  els.notesList.addEventListener("click", (e) => {
    const item = e.target.closest(".note-item");
    if (item) selectNote(item.dataset.id);
  });

  els.menuBtn.addEventListener("click", openSidebar);
  els.scrim.addEventListener("click", closeSidebar);

  els.titleInput.addEventListener("keydown", (e) => {
    if (e.key === "Enter") {
      e.preventDefault();
      els.bodyInput.focus();
    }
  });

  document.addEventListener("keydown", (e) => {
    const mod = e.ctrlKey || e.metaKey;

    if (mod && e.key.toLowerCase() === "s") {
      e.preventDefault();
      clearTimeout(saveTimer);
      persist();
      renderList();
      setSaveState("Saved");
    }

    if (mod && e.key.toLowerCase() === "n") {
      e.preventDefault();
      createNote();
    }

    if (mod && e.key.toLowerCase() === "f") {
      e.preventDefault();
      els.search.focus();
    }
  });

  window.addEventListener("beforeunload", () => {
    clearTimeout(saveTimer);
    persist();
  });

  document.addEventListener("visibilitychange", () => {
    if (document.hidden) {
      clearTimeout(saveTimer);
      persist();
    }
  });

  /* ---------------- Init ---------------- */

  function init() {
    loadFromStorage();

    if (!notes.length) {
      const now = Date.now();
      notes.push({
        id: uid(),
        title: "Welcome ✦",
        body:
          "Welcome to Memory Keep Note.\n\n" +
          "• Everything saves automatically as you type\n" +
          "• Hit “New note” to start another page\n" +
          "• Use the search box to find old notes\n" +
          "• Download any note as a .txt file\n\n" +
          "Shortcuts: Ctrl/Cmd + N = new note, Ctrl/Cmd + S = save now.\n\n" +
          "Now go ahead. Delete this and write your own stuff.",
        created: now,
        updated: now,
      });
      persist();
    }

    const sorted = notes.slice().sort((a, b) => b.updated - a.updated);
    activeId = sorted[0] ? sorted[0].id : null;

    loadActiveIntoEditor();
    renderList();
    setSaveState("Ready");
  }

  init();
})();
</script>
<script>
(() => {
  "use strict";
  const STORAGE_KEY = "glass-notes-v1";
  const ACTIVE_ACCOUNT_KEY = "glass-notes-account-v1";
  const $ = (selector) => document.querySelector(selector);
  let user = null;
  let mode = "login";
  let hydrating = false;
  let syncTimer = null;
  let billingStatus = null;
  const nativeSetItem = Storage.prototype.setItem;

  function setGateReady() {
    document.body.classList.remove("auth-pending");
    document.body.classList.add("auth-ready");
    const accountButton = $("#accountBtn");
    accountButton.textContent = user.email;
    accountButton.title = "Sign out of " + user.email;
  }

  async function request(url, options = {}) {
    const response = await fetch(url, { ...options, headers: { "Content-Type": "application/json", ...(options.headers || {}) } });
    const body = response.status === 204 ? null : await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(body.error || "Request failed. Please try again.");
    return body;
  }

  async function refreshBillingStatus(showMessage = "") {
    const card=$("#billingCard"),planLabel=$("#billingPlanLabel"),message=$("#billingPlanMessage"),monthly=$("#billingMonthlyBtn"),yearly=$("#billingYearlyBtn"),manage=$("#billingManageBtn");
    try {
      billingStatus=await request("/api/billing/status");
      window.dispatchEvent(new CustomEvent("mkn:billing-updated",{detail:billingStatus}));
      card.hidden=false;
      planLabel.textContent=billingStatus.planName+" plan";
      const active=["active","trialing","admin","admin-granted"].includes(billingStatus.subscriptionStatus);
      if(showMessage)message.textContent=showMessage;
      else if(billingStatus.subscriptionStatus==="admin")message.textContent="Administrator access · all features included.";
      else if(billingStatus.subscriptionStatus==="admin-granted")message.textContent="Plus access was granted by the administrator.";
      else if(active)message.textContent="Paid access is active"+(billingStatus.currentPeriodEnd?" through "+new Date(billingStatus.currentPeriodEnd).toLocaleDateString():"")+".";
      else message.textContent=billingStatus.planName==="Plus"?"Plus access is active.":"Free plan · 1 GB included.";
      const offer=billingStatus.offer,hasPlus=billingStatus.planId==="plus"||billingStatus.planId==="admin";
      monthly.hidden=yearly.hidden=true;
      manage.hidden=!billingStatus.canManageSubscription;
      if(offer&&!hasPlus){monthly.hidden=yearly.hidden=false;monthly.textContent="Monthly · $"+offer.monthlyAmount;yearly.textContent="Yearly · $"+offer.yearlyAmount;monthly.disabled=yearly.disabled=!billingStatus.stripeConfigured;if(!billingStatus.stripeConfigured)message.textContent="Payments are being configured. Please check back later."}
    } catch(error) {
      card.hidden=false;planLabel.textContent="Plan status unavailable";message.textContent=error.message;monthly.hidden=yearly.hidden=manage.hidden=true;
    }
  }

  async function startCheckout(interval,button) {
    button.disabled=true;$("#billingPlanMessage").textContent="Opening secure Stripe Checkout…";
    try {const result=await request("/api/billing/checkout",{method:"POST",body:JSON.stringify({interval})});location.assign(result.url)}
    catch(error){$("#billingPlanMessage").textContent=error.message;button.disabled=false}
  }

  function queueSync(raw) {
    if (!user || hydrating) return;
    clearTimeout(syncTimer);
    syncTimer = setTimeout(async () => {
      try {
        const notes = JSON.parse(raw);
        const result = await request("/api/notes/sync", { method: "POST", body: JSON.stringify({ notes }) });
        if (result?.storage) window.dispatchEvent(new CustomEvent("mkn:storage-updated", { detail: result.storage }));
      } catch (error) {
        const state = $("#saveState");
        if (state) state.textContent = "Could not sync. Retrying.";
      }
    }, 550);
  }

  Storage.prototype.setItem = function(key, value) {
    nativeSetItem.call(this, key, value);
    if (this === localStorage && key === STORAGE_KEY) queueSync(value);
  };

  async function hydrate(account) {
    user = account;
    const activeAccount = localStorage.getItem(ACTIVE_ACCOUNT_KEY);
    if (activeAccount === user.id) setGateReady();
    const folderResponse = await request("/api/folders");
    window.dispatchEvent(new CustomEvent("mkn:folders-updated", { detail: folderResponse.folders }));
    if (activeAccount !== user.id) {
      hydrating = true;
      try {
        const remote = await request("/api/notes");
        window.dispatchEvent(new CustomEvent("mkn:storage-updated", { detail: remote.storage }));
        // Import device-only notes only on the very first account setup. A later
        // account must never inherit cached notes from someone else's session.
        const local = activeAccount ? [] : JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        const notes = remote.notes.length ? remote.notes : local;
        nativeSetItem.call(localStorage, STORAGE_KEY, JSON.stringify(notes));
        nativeSetItem.call(localStorage, ACTIVE_ACCOUNT_KEY, user.id);
        if (!remote.notes.length && notes.length) {
          const result = await request("/api/notes/sync", { method: "POST", body: JSON.stringify({ notes }) });
          if (result?.storage) window.dispatchEvent(new CustomEvent("mkn:storage-updated", { detail: result.storage }));
        }
      } finally { hydrating = false; }
      location.reload();
      return;
    }
    try {
      window.dispatchEvent(new CustomEvent("mkn:storage-updated", { detail: await request("/api/storage") }));
    } catch (error) {
      window.dispatchEvent(new CustomEvent("mkn:storage-error"));
      throw error;
    }
    setGateReady();
    const billingReturn=new URLSearchParams(location.search).get("billing");
    await refreshBillingStatus(billingReturn==="success"?"Payment received. Confirming your subscription…":billingReturn==="cancelled"?"Checkout cancelled; no payment was made.":"");
    if(billingReturn==="success"){
      for(let attempt=0;attempt<5&&!["active","trialing"].includes(billingStatus?.subscriptionStatus);attempt++){await new Promise(resolve=>setTimeout(resolve,2000));await refreshBillingStatus("Payment received. Confirming your subscription…")}
      if(["active","trialing"].includes(billingStatus?.subscriptionStatus))await refreshBillingStatus("Your Plus subscription is active.");
    }
    if(billingReturn){const returnUrl=new URL(location.href);returnUrl.searchParams.delete("billing");history.replaceState(null,"",returnUrl)}
  }

  function showHydrationError(error) {
    if (user && localStorage.getItem(ACTIVE_ACCOUNT_KEY) === user.id) {
      setGateReady();
      const state = $("#saveState");
      if (state) {
        state.textContent = "Signed in · Sync unavailable";
        state.title = error.message;
      }
      console.error("Could not finish loading account data.", error);
      return;
    }
    $("#authError").textContent = error.message || "The secure notes service is unavailable. Please try again shortly.";
    document.body.classList.remove("auth-pending");
  }

  function showForm() {
    const creating = mode === "register";
    $("#authTitle").textContent = creating ? "Create your secure account" : "Keep your notes safe";
    $("#authDescription").textContent = creating ? "Your notes will be available after browser data is cleared or on another device." : "Sign in to access notes saved securely to your account.";
    $("#authSubmit").textContent = creating ? "Create account" : "Sign in";
    $("#authPassword").autocomplete = creating ? "new-password" : "current-password";
    ["#authFullNameRow", "#authConfirmPasswordRow"].forEach((selector) => $(selector).hidden = !creating);
    $("#authFullName").required = creating;
    $("#authConfirmPassword").required = creating;
    $("#authSwitch").textContent = creating ? "Already have an account? Sign in" : "Need an account? Create one";
    $("#authError").textContent = "";
  }

  $("#authSwitch").addEventListener("click", () => { mode = mode === "login" ? "register" : "login"; showForm(); });
  $("#authForm").addEventListener("submit", async (event) => {
    event.preventDefault();
    const button = $("#authSubmit");
    const error = $("#authError");
    button.disabled = true;
    error.textContent = "";
    try {
      if (mode === "register" && $("#authPassword").value !== $("#authConfirmPassword").value) throw new Error("Passwords do not match.");
      const response = await request("/api/auth/" + mode, { method: "POST", body: JSON.stringify({ fullName: $("#authFullName").value, email: $("#authEmail").value, password: $("#authPassword").value }) });
      await hydrate(response.user);
    } catch (requestError) { showHydrationError(requestError); }
    finally { button.disabled = false; }
  });
  $("#accountBtn").addEventListener("click", async () => {
    if (!user || !confirm("Sign out of " + user.email + "? Your saved notes will remain in your account.")) return;
    try {
      await request("/api/auth/logout", { method: "POST", body: "{}" });
      location.reload();
    } catch (error) { alert(error.message); }
  });
  $("#billingMonthlyBtn").addEventListener("click",event=>startCheckout("monthly",event.currentTarget));
  $("#billingYearlyBtn").addEventListener("click",event=>startCheckout("yearly",event.currentTarget));
  $("#billingManageBtn").addEventListener("click",async event=>{const button=event.currentTarget;button.disabled=true;$("#billingPlanMessage").textContent="Opening secure billing portal…";try{const result=await request("/api/billing/portal",{method:"POST",body:"{}"});location.assign(result.url)}catch(error){$("#billingPlanMessage").textContent=error.message;button.disabled=false}});

  window.addEventListener("mkn:folder-action", async (event) => {
    const { action, folderId, name } = event.detail || {};
    try {
      if (action === "create") await request("/api/folders", { method: "POST", body: JSON.stringify({ name }) });
      else if (action === "rename") await request("/api/folders/" + encodeURIComponent(folderId), { method: "PATCH", body: JSON.stringify({ name }) });
      else if (action === "delete") {
        await request("/api/folders/" + encodeURIComponent(folderId), { method: "DELETE", body: "{}" });
        const cached = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        cached.forEach((note) => { if (note.folderId === folderId) note.folderId = null; });
        localStorage.setItem(STORAGE_KEY, JSON.stringify(cached));
        window.dispatchEvent(new CustomEvent("mkn:folder-deleted", { detail: folderId }));
      } else return;
      const { folders } = await request("/api/folders");
      window.dispatchEvent(new CustomEvent("mkn:folders-updated", { detail: folders }));
    } catch (error) {
      window.dispatchEvent(new CustomEvent("mkn:folder-action-error", { detail: error.message }));
    }
  });

  request("/api/auth/me").then(({ user: account }) => {
    if (account) return hydrate(account).catch(showHydrationError);
    document.body.classList.remove("auth-pending");
  }).catch(showHydrationError);
  showForm();
})();
</script>
<script>
(() => {
  if (!document.documentElement.classList.contains("embedded-notes")) return;
  let resizeScheduled = false;
  const reportHeight = () => {
    resizeScheduled = false;
    const height = Math.ceil(document.querySelector(".app").getBoundingClientRect().height);
    window.parent.postMessage({ type: "mkn:embedded-height", height }, location.origin);
  };
  const scheduleReport = () => {
    if (resizeScheduled) return;
    resizeScheduled = true;
    requestAnimationFrame(reportHeight);
  };
  const observer = new ResizeObserver(scheduleReport);
  observer.observe(document.documentElement);
  observer.observe(document.querySelector(".app"));
  window.addEventListener("load", scheduleReport);
  window.addEventListener("resize", scheduleReport);
  scheduleReport();
})();
</script>
</body>
</html>
