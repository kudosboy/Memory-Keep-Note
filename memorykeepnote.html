<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#07070f">
<title>Memory Keep Note</title>
<script>if(window.parent!==window)document.documentElement.classList.add("embedded-notes");</script>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="/manifest.json">
<script src="/pwa-register.js" defer></script>
<script src="/password-toggle.js" defer></script>
<script src="/site-content.js" defer></script>
<style>
  /* ---------- Base ---------- */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --text: #f2f3ff;
    --muted: rgba(242, 243, 255, 0.52);
    --border: rgba(255, 255, 255, 0.14);
    --panel: rgba(16, 16, 32, 0.42);
    --item: rgba(255, 255, 255, 0.05);
    --item-hover: rgba(255, 255, 255, 0.10);
    --accent: #8b7bff;
    --accent-2: #ff5fa8;
  }

  html, body { height: 100%; }

  body {
    font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, Inter, sans-serif;
    color: var(--text);
    background: #07070f;
    overflow: hidden;
    -webkit-font-smoothing: antialiased;
  }

  /* ---------- Animated background ---------- */
  .bg {
    position: fixed;
    inset: 0;
    z-index: -1;
    overflow: hidden;
    background:
      radial-gradient(circle at 15% 15%, #241a52 0%, transparent 55%),
      radial-gradient(circle at 88% 80%, #0b3346 0%, transparent 55%),
      #07070f;
  }
  .blob {
    position: absolute;
    border-radius: 50%;
    filter: blur(90px);
    opacity: 0.5;
    animation: float 20s ease-in-out infinite;
    will-change: transform;
  }
  .b1 { width: 520px; height: 520px; background: #6d4bff; top: -140px; left: -120px; }
  .b2 { width: 460px; height: 460px; background: #ff3d9a; bottom: -160px; right: -100px; animation-delay: -7s; }
  .b3 { width: 420px; height: 420px; background: #00d0ff; top: 40%; left: 48%; animation-delay: -13s; opacity: 0.35; }

  @keyframes float {
    0%, 100% { transform: translate(0, 0) scale(1); }
    33%      { transform: translate(45px, -55px) scale(1.12); }
    66%      { transform: translate(-35px, 35px) scale(0.94); }
  }

  /* ---------- Glass ---------- */
  .glass {
    background: var(--panel);
    backdrop-filter: blur(26px) saturate(170%);
    -webkit-backdrop-filter: blur(26px) saturate(170%);
    border: 1px solid var(--border);
    border-radius: 22px;
    box-shadow:
      0 10px 40px rgba(0, 0, 0, 0.45),
      inset 0 1px 0 rgba(255, 255, 255, 0.12);
  }

  /* ---------- Layout ---------- */
  .app {
    display: flex;
    gap: 16px;
    padding: 16px;
    height: 100vh;
    height: 100dvh;
    max-width: 1500px;
    margin: 0 auto;
  }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 310px;
    flex: 0 0 310px;
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 18px;
    min-height: 0;
    overflow-y: auto;
    scrollbar-gutter: stable;
    z-index: 60;
  }

  .brand {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 2px 2px 4px;
  }
  .logo {
    width: 42px; height: 42px;
    display: grid; place-items: center;
    border-radius: 14px;
    font-size: 19px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 6px 20px rgba(139, 123, 255, 0.45);
  }
  .brand h1 {
    font-size: 16px;
    font-weight: 650;
    letter-spacing: 0.2px;
  }
  .brand p {
    font-size: 11.5px;
    color: var(--muted);
    margin-top: 2px;
  }

  .new-btn {
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    width: 100%;
    padding: 12px;
    border-radius: 15px;
    border: 1px solid rgba(255, 255, 255, 0.18);
    background: linear-gradient(135deg, rgba(139, 123, 255, 0.9), rgba(255, 95, 168, 0.85));
    color: #fff;
    font: inherit;
    font-weight: 620;
    font-size: 14px;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(139, 123, 255, 0.32);
    transition: transform 0.18s ease, box-shadow 0.18s ease, filter 0.18s ease;
  }
  .new-btn:hover { filter: brightness(1.08); box-shadow: 0 12px 30px rgba(139, 123, 255, 0.42); }
  .new-btn:active { transform: translateY(0) scale(0.985); }
  .new-btn svg { width: 16px; height: 16px; }

  .search-wrap {
    flex: 0 0 auto;
    position: relative;
    display: flex;
    align-items: center;
  }
  .search-wrap svg {
    position: absolute;
    left: 12px;
    width: 15px; height: 15px;
    color: var(--muted);
    pointer-events: none;
  }
  #search {
    width: 100%;
    padding: 10px 12px 10px 35px;
    border-radius: 13px;
    border: 1px solid rgba(255, 255, 255, 0.10);
    background: rgba(255, 255, 255, 0.05);
    color: var(--text);
    font: inherit;
    font-size: 13.5px;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
  }
  #search::placeholder { color: var(--muted); }
  #search:focus { border-color: rgba(139, 123, 255, 0.55); background: rgba(255, 255, 255, 0.08); }

  .organize-panel { display: grid; flex: 0 0 auto; gap: 10px; }
  .nav-section { display: grid; gap: 4px; }
  .nav-heading { display: flex; align-items: center; justify-content: space-between; padding: 0 4px; color: var(--muted); font-size: 10px; font-weight: 700; letter-spacing: .09em; text-transform: uppercase; }
  .nav-list { display: grid; gap: 2px; }
  .nav-row { display: flex; align-items: center; gap: 4px; min-width: 0; }
  .nav-item, .nav-action { min-height: 34px; border: 0; border-radius: 9px; background: transparent; color: var(--muted); font: inherit; cursor: pointer; }
  .nav-item { display: flex; align-items: center; gap: 8px; flex: 1; min-width: 0; padding: 6px 9px; text-align: left; font-size: 12px; }
  .nav-item span:first-child { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .nav-item:hover, .nav-action:hover, .nav-item.active { background: var(--item-hover); color: var(--text); }
  .nav-item.active { box-shadow: inset 0 0 0 1px rgba(139, 123, 255, .36); }
  .nav-count { margin-left: auto; color: var(--muted); font-size: 10px; }
  .nav-action { flex: 0 0 30px; width: 30px; font-size: 15px; }
  .nav-item:focus-visible, .nav-action:focus-visible, .format-btn:focus-visible, .icon-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .organize-panel #viewList { max-height: none; overflow: visible; }
  .organize-panel .nav-list:not(#viewList) { max-height: 84px; overflow-y: auto; }
  .inline-form { display:grid; gap:6px; padding:7px; border:1px solid var(--border); border-radius:10px; background:rgba(255,255,255,.04); }
  .inline-form[hidden] { display:none; }
  .inline-form label { display:grid; gap:4px; color:var(--muted); font-size:10px; }
  .inline-form input { width:100%; min-width:0; padding:7px 8px; border:1px solid var(--border); border-radius:7px; background:rgba(255,255,255,.06); color:var(--text); font:inherit; font-size:12px; }
  .inline-form-actions { display:flex; gap:6px; }
  .inline-form button { min-height:30px; padding:4px 9px; border:1px solid var(--border); border-radius:7px; background:rgba(255,255,255,.07); color:var(--text); font:inherit; font-size:11px; cursor:pointer; }
  .inline-form button[type="submit"] { background:rgba(139,123,255,.25); }
  .org-error { color:#ff9aad; font-size:11px; line-height:1.4; }
  .sr-only { position:absolute; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0,0,0,0); white-space:nowrap; border:0; }

  .notes-list {
    flex: 1 0 120px;
    min-height: 120px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding-right: 4px;
  }

  .note-item {
    position: relative;
    width: 100%;
    text-align: left;
    padding: 8px 10px;
    border-radius: 11px;
    border: 1px solid transparent;
    background: var(--item);
    color: inherit;
    font: inherit;
    cursor: pointer;
    transition: background 0.18s, border-color 0.18s, transform 0.18s;
  }
  .note-item:hover { background: var(--item-hover); }
  .note-item.active {
    background: rgba(139, 123, 255, 0.16);
    border-color: rgba(139, 123, 255, 0.55);
    box-shadow: inset 0 0 0 1px rgba(139, 123, 255, .18);
  }

  .ni-title {
    font-size: 12.5px;
    font-weight: 600;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 3px;
  }
  .ni-preview {
    font-size: 10.5px;
    color: var(--muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    margin-bottom: 5px;
  }
  .ni-date {
    font-size: 9.5px;
    color: rgba(242, 243, 255, 0.36);
    letter-spacing: 0.3px;
  }

  .empty-list {
    text-align: center;
    font-size: 12.5px;
    color: var(--muted);
    padding: 26px 10px;
  }
  .notes-heading { display:flex; align-items:center; justify-content:space-between; flex:0 0 auto; padding:2px 4px 0; color:var(--muted); font-size:10px; font-weight:700; letter-spacing:.09em; text-transform:uppercase; }
  .notes-heading-count { color:var(--muted); font-size:10px; font-weight:500; letter-spacing:0; }
  .storage-meter { display:grid; gap:5px; flex:0 0 auto; padding:8px 10px; border:1px solid rgba(255,255,255,.09); border-radius:10px; background:rgba(255,255,255,.035); }
  .storage-meter-label { display:flex; align-items:center; justify-content:space-between; gap:8px; color:var(--muted); font-size:10px; }
  .storage-meter-label strong { color:var(--text); font-size:10px; font-weight:600; }
  .storage-meter-track { height:4px; overflow:hidden; border-radius:999px; background:rgba(255,255,255,.10); }
  .storage-meter-fill { width:0; height:100%; border-radius:inherit; background:linear-gradient(90deg,var(--accent),var(--accent-2)); transition:width .2s ease; }
  .billing-card { display:grid; gap:7px; flex:0 0 auto; padding:9px 10px; border:1px solid rgba(163,151,255,.24); border-radius:11px; background:rgba(163,151,255,.07); }
  .billing-card strong { font-size:11px; }
  .billing-card p { margin:0; color:var(--muted); font-size:10px; line-height:1.4; }
  .billing-actions { display:grid; grid-template-columns:1fr 1fr; gap:6px; }
  .billing-actions button { min-height:30px; padding:5px 7px; border:1px solid rgba(163,151,255,.35); border-radius:8px; background:rgba(163,151,255,.12); color:var(--text); font:inherit; font-size:10px; cursor:pointer; }
  .billing-actions button:hover:not(:disabled) { background:rgba(163,151,255,.22); }
  .billing-actions button:disabled { opacity:.55; cursor:wait; }
  .sidebar-footer { position:sticky; bottom:-18px; z-index:2; display:grid; flex:0 0 auto; gap:7px; margin-top:auto; padding:8px 0 0; background:linear-gradient(180deg,rgba(16,16,32,0),rgba(16,16,32,.98) 24%); }

  /* ---------- Editor ---------- */
  .editor {
    flex: 1;
    display: flex;
    flex-direction: column;
    padding: 20px 24px 16px;
    min-width: 0;
    min-height: 0;
    transition: background 0.2s ease;
  }

  .editor-head {
    display: flex;
    align-items: center;
    gap: 10px;
    padding-bottom: 14px;
    border-bottom: 1px solid rgba(255, 255, 255, 0.08);
  }

  .title-input {
    flex: 1;
    min-width: 0;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font: inherit;
    font-size: 21px;
    font-weight: 650;
    letter-spacing: -0.2px;
    padding: 4px 2px;
  }
  .title-input::placeholder { color: rgba(242, 243, 255, 0.30); }

  .head-actions { display: flex; gap: 8px; }

  .icon-btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 38px; height: 38px;
    flex: 0 0 auto;
    border-radius: 12px;
    border: 1px solid rgba(255, 255, 255, 0.12);
    background: rgba(255, 255, 255, 0.06);
    color: var(--text);
    cursor: pointer;
    transition: background 0.18s, transform 0.18s, border-color 0.18s, color 0.18s;
  }
  .icon-btn svg { width: 17px; height: 17px; }
  .icon-btn:hover { background: rgba(255, 255, 255, 0.14); transform: translateY(-1px); }
  .icon-btn:active { transform: translateY(0) scale(0.94); }
  .icon-btn.danger:hover { background: rgba(255, 76, 110, 0.22); border-color: rgba(255, 76, 110, 0.55); color: #ff8ba3; }
  .icon-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

  .menu-btn { display: none; }

  .body-input {
    flex: 1;
    min-height: 0;
    min-width: 0;
    width: 100%;
    margin-top: 14px;
    padding: 4px 2px;
    background: transparent;
    border: none;
    outline: none;
    resize: none;
    color: rgba(242, 243, 255, 0.92);
    font: inherit;
    font-size: 15.5px;
    line-height: 1.78;
    overflow-x: hidden;
    overflow-y: auto;
    overflow-wrap: anywhere;
    overscroll-behavior: contain;
  }
  .body-input::placeholder { color: rgba(242, 243, 255, 0.28); }
  .body-input[contenteditable="true"]:empty::before { content: attr(data-placeholder); color: rgba(242,243,255,.28); pointer-events: none; }
  .body-input img { display:block; max-width:100%; max-height:min(560px,70vh); height:auto; margin:12px 0; border-radius:12px; object-fit:contain; }
  .body-input h1,.body-input h2,.body-input h3 { margin:.75em 0 .35em; line-height:1.3; }
  .body-input h1 { font-size:1.8em; }
  .body-input h2 { font-size:1.45em; }
  .body-input h3 { font-size:1.2em; }
  .body-input blockquote { margin:.75em 0; padding-left:14px; border-left:3px solid var(--accent); color:var(--muted); }
  .body-input pre { overflow-x:auto; margin:.75em 0; padding:12px; border:1px solid var(--border); border-radius:10px; background:rgba(0,0,0,.24); font:13px/1.6 ui-monospace,SFMono-Regular,Consolas,monospace; }
  .body-input ul,.body-input ol { padding-left:1.6em; }
  .body-input table { width:100%; margin:12px 0; border-collapse:collapse; }
  .body-input td,.body-input th { min-width:90px; padding:8px; border:1px solid var(--border); vertical-align:top; }
  .format-bar { display:flex; flex-wrap:wrap; gap:6px; margin-top:12px; }
  .format-btn { min-width:34px; height:32px; padding:0 8px; border:1px solid rgba(255,255,255,.12); border-radius:9px; background:rgba(255,255,255,.05); color:var(--text); cursor:pointer; font:inherit; font-size:12px; }
  .format-btn:hover,.format-btn:focus-visible { background:rgba(139,123,255,.25); outline:none; }
  .note-tools { display:flex; align-items:center; flex-wrap:wrap; gap:7px; margin-top:9px; }
  .note-tool, .folder-select { min-height:34px; padding:6px 9px; border:1px solid rgba(255,255,255,.12); border-radius:9px; background:rgba(255,255,255,.05); color:var(--text); font:inherit; font-size:11px; }
  .note-tool { cursor:pointer; }
  .note-tool:hover:not(:disabled) { background:rgba(139,123,255,.2); }
  .note-tool:disabled, .folder-select:disabled { opacity:.4; cursor:not-allowed; }
  .folder-select { max-width:min(100%, 220px); }
  .color-picker-wrap { display:inline-flex; align-items:center; gap:7px; min-height:34px; padding:4px 8px; border:1px solid rgba(255,255,255,.12); border-radius:9px; background:rgba(255,255,255,.05); color:var(--text); font-size:11px; }
  .color-menu-trigger { display:inline-flex; align-items:center; gap:6px; min-height:27px; padding:3px 7px; border:1px solid var(--border); border-radius:8px; background:rgba(255,255,255,.06); color:var(--text); font:inherit; cursor:pointer; }
  .color-menu-trigger:hover:not(:disabled), .color-menu-trigger[aria-expanded="true"] { background:rgba(255,255,255,.13); }
  .color-menu-trigger:focus-visible, .color-choice:focus-visible, .color-custom:focus-within { outline:2px solid var(--accent); outline-offset:2px; }
  .color-menu-trigger:disabled { opacity:.4; cursor:not-allowed; }
  .color-swatch { width:17px; height:17px; flex:0 0 auto; border:1px solid rgba(255,255,255,.45); border-radius:5px; background:var(--selected-color, #181824); }
  .color-palette { flex:1 0 100%; display:flex; align-items:center; flex-wrap:wrap; gap:8px; padding:10px; border:1px solid var(--border); border-radius:13px; background:rgba(16,16,32,.94); }
  .color-palette[hidden] { display:none; }
  .color-palette-title { flex-basis:100%; color:var(--muted); font-size:11px; }
  .color-choice { display:grid; place-items:center; width:30px; height:30px; padding:3px; border:1px solid transparent; border-radius:9px; background:transparent; cursor:pointer; }
  .color-choice[aria-pressed="true"] { border-color:var(--accent); background:rgba(139,123,255,.18); }
  .color-choice .color-swatch { width:20px; height:20px; border-radius:6px; }
  .color-custom { display:inline-flex; align-items:center; gap:7px; min-height:30px; padding:3px 8px; border:1px solid var(--border); border-radius:9px; color:var(--text); font-size:11px; cursor:pointer; }
  .color-custom:hover { background:rgba(255,255,255,.1); }
  .color-custom:focus-within { outline:2px solid var(--accent); outline-offset:2px; }
  .color-custom input { width:27px; height:27px; padding:2px; border:1px solid var(--border); border-radius:7px; background:rgba(0,0,0,.2); cursor:pointer; }
  .color-custom input::-webkit-color-swatch-wrapper { padding:1px; }
  .color-custom input::-webkit-color-swatch { border:1px solid rgba(255,255,255,.4); border-radius:4px; }
  .color-help { flex-basis:100%; color:var(--muted); font-size:10px; }
  .share-panel { display:flex; flex-wrap:wrap; align-items:center; gap:8px; padding:9px; border:1px solid var(--border); border-radius:12px; background:rgba(16,16,32,.72); }
  .share-panel[hidden] { display:none; }
  .share-panel input { flex:1 1 220px; min-width:0; padding:8px 10px; border:1px solid var(--border); border-radius:8px; background:rgba(255,255,255,.06); color:var(--text); font:inherit; font-size:11px; }
  .share-error { flex-basis:100%; color:#ff9aad; font-size:11px; }
  .share-error[hidden] { display:none; }
  .note-attachments { display:grid; gap:8px; margin:4px 0 12px; }
  .attachment-item { display:flex; align-items:center; flex-wrap:wrap; gap:9px; padding:9px 11px; border:1px solid var(--border); border-radius:12px; background:rgba(255,255,255,.035); }
  .attachment-name { flex:1 1 160px; min-width:0; overflow-wrap:anywhere; color:var(--text); font-size:12px; }
  .attachment-meta { color:var(--muted); font-size:10px; }
  .attachment-action { border:0; padding:4px 7px; border-radius:8px; background:rgba(255,255,255,.07); color:var(--text); font:inherit; font-size:11px; text-decoration:none; cursor:pointer; }
  .attachment-action:hover { background:rgba(139,123,255,.2); }
  .attachment-player { flex-basis:100%; width:min(100%,520px); }
  .attachment-error { margin:0; padding:8px 10px; border:1px solid rgba(255,154,173,.22); border-radius:10px; background:rgba(255,154,173,.07); color:var(--muted); font-size:11px; }
  .dropdown { position:relative; min-width:0; }
  .dropdown-trigger { display:flex; align-items:center; justify-content:space-between; gap:10px; width:100%; min-height:38px; padding:8px 11px; border:1px solid rgba(255,255,255,.13); border-radius:12px; background:rgba(255,255,255,.055); color:var(--text); font:inherit; font-size:12px; text-align:left; cursor:pointer; }
  .dropdown-trigger:hover, .dropdown-trigger[aria-expanded="true"] { border-color:rgba(139,123,255,.52); background:rgba(255,255,255,.09); }
  .dropdown-trigger:disabled { opacity:.4; cursor:not-allowed; }
  .dropdown-trigger:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .dropdown-value { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .dropdown-chevron { width:14px; height:14px; flex:0 0 auto; transition:transform .16s ease; }
  .dropdown-trigger[aria-expanded="true"] .dropdown-chevron { transform:rotate(180deg); }
  .dropdown-menu { position:absolute; top:calc(100% + 6px); left:0; right:0; z-index:80; display:grid; gap:3px; max-height:220px; overflow-y:auto; padding:5px; border:1px solid rgba(255,255,255,.16); border-radius:13px; background:#171728; box-shadow:0 12px 32px rgba(0,0,0,.4); }
  .dropdown-menu[hidden] { display:none; }
  .dropdown-option { width:100%; min-height:34px; padding:7px 9px; border:0; border-radius:8px; background:transparent; color:var(--text); font:inherit; font-size:12px; text-align:left; cursor:pointer; }
  .dropdown-option:hover, .dropdown-option:focus-visible { outline:none; background:rgba(255,255,255,.09); }
  .dropdown-option[aria-selected="true"] { background:rgba(139,123,255,.2); color:#e4e0ff; }
  .nav-section > .dropdown { width:100%; }
  #folderDropdown { width:min(190px, 100%); }
  .note-meta { display:flex; gap:7px; flex-wrap:wrap; margin:0 0 8px; }
  .note-tag { border:0; border-radius:999px; padding:4px 8px; background:rgba(139,123,255,.17); color:#d8d3ff; font-size:11px; cursor:pointer; }

  .status {
    display: flex;
    align-items: center;
    gap: 9px;
    flex-wrap: wrap;
    padding-top: 12px;
    margin-top: 10px;
    border-top: 1px solid rgba(255, 255, 255, 0.08);
    font-size: 11.5px;
    color: var(--muted);
    letter-spacing: 0.2px;
  }
  .status .dot { opacity: 0.35; }

<script>
(function () {
  "use strict";

  const STORAGE_KEY = "glass-notes-v1";

  const $ = (sel) => document.querySelector(sel);
  const els = {
    sidebar:    $("#sidebar"),

    cancelFolderBtn: $("#cancelFolderBtn"),

    cancelTagBtn: $("#cancelTagBtn"),
    tagError: $("#tagError"),

    sharePanel: $("#sharePanel"),

    revokeShareBtn: $("#revokeShareBtn"),
    shareError: $("#shareError"),
    noteColor: $("#noteColor"),
    colorMenuBtn: $("#colorMenuBtn"),
    colorPalette: $("#colorPalette"),
    colorSwatch: $("#colorSwatch"),
    imageBtn: $("#imageBtn"),
