<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Choose a new password | Memory Keep Note</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#090812"><script src="/pwa-register.js" defer></script><script src="/site-content.js" defer></script><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07070f;color:#f2f3ff;font:16px system-ui,sans-serif}.card{width:min(90vw,400px);padding:28px;border:1px solid #ffffff24;border-radius:20px;background:#17172ad9}input,button{box-sizing:border-box;width:100%;margin-top:10px;padding:12px;border-radius:10px;font:inherit}input{border:1px solid #ffffff33;background:#ffffff0d;color:white}button{border:0;background:linear-gradient(135deg,#8b7bff,#ff5fa8);color:white;font-weight:700;cursor:pointer}p{color:#c9c9dc;line-height:1.5}a{color:#bdb4ff}#message{min-height:22px}</style></head><body><main class="card"><h1>Choose a new password</h1><p>Use at least 10 characters.</p><form id="form"><input id="password" type="password" autocomplete="new-password" minlength="10" maxlength="128" placeholder="New password" required><button>Update password</button></form><p id="message" role="alert"></p><a href="sign-in.html">Back to sign in</a><br><br><a href="/">← Back to website</a></main><script>const token=new URLSearchParams(location.search).get("token"),m=document.querySelector("#message");if(!token)m.textContent="This reset link is invalid.";document.querySelector("#form").addEventListener("submit",async e=>{e.preventDefault();if(!token)return;try{const r=await fetch("/api/auth/reset-password",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({token,password:document.querySelector("#password").value})}),d=await r.json();if(!r.ok)throw Error(d.error);m.textContent="Password updated. You can now sign in."}catch(e){m.textContent=e.message}})</script></body></html>
