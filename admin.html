<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Memory Keep Note</title><link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>:root{color-scheme:dark;--bg:#090812;--panel:#141321;--line:#ffffff1f;--ink:#f6f4ff;--muted:#b7b1c9;--good:#7be6b0}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 0 0,#2e2361,transparent 35%),var(--bg);color:var(--ink);font:15px system-ui,sans-serif}.wrap{width:min(1180px,calc(100% - 32px));margin:auto;padding:30px 0 70px}header{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:30px}.brand{display:flex;gap:10px;align-items:center;font-weight:750}.mark{display:grid;place-items:center;width:37px;height:37px;border-radius:12px;background:linear-gradient(135deg,#8b7bff,#ff5fa8)}button,a.button{border:1px solid var(--line);border-radius:10px;padding:9px 12px;background:#ffffff0a;color:var(--ink);font:inherit;cursor:pointer;text-decoration:none}.danger{border-color:#ff759c66;color:#ffc0cf}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat,.table-wrap{border:1px solid var(--line);border-radius:17px;background:var(--panel)}.stat{padding:20px}.stat span{display:block;color:var(--muted);font-size:13px}.stat strong{display:block;margin-top:7px;font-size:31px}.table-wrap{margin-top:24px;overflow:auto}.table-head{display:flex;justify-content:space-between;gap:15px;align-items:center;padding:20px}.table-head h2{margin:0;font-size:18px}.table-head p{margin:4px 0 0;color:var(--muted);font-size:13px}table{width:100%;border-collapse:collapse;min-width:760px}th,td{padding:14px 20px;text-align:left;border-top:1px solid var(--line)}th{color:var(--muted);font-size:12px;font-weight:600}td{font-size:14px}.name{font-weight:650}.email{color:var(--muted);font-size:12px;margin-top:3px}.badge{display:inline-block;padding:4px 8px;border-radius:999px;background:#ffffff12;color:var(--muted);font-size:12px}.badge.active{background:#48d8941c;color:var(--good)}.badge.admin{background:#9889ff27;color:#c6beff}.actions{display:flex;gap:7px}#message{min-height:20px;color:#ffb8ca}body.loading .wrap{opacity:.25;pointer-events:none}@media(max-width:620px){.stats{grid-template-columns:1fr}.wrap{width:min(100% - 22px,1180px)}}</style></head>
<body class="loading"><main class="wrap"><header><div class="brand"><span class="mark">&#10022;</span><span>Memory Keep Note <small style="color:#b7b1c9">/ Admin</small></span></div><div><a class="button" href="memorykeepnote.html">Open notes</a> <button id="logout">Sign out</button></div></header><p id="message" role="alert"></p><section class="stats"><article class="stat"><span>Total accounts</span><strong id="users">—</strong></article><article class="stat"><span>Active notes</span><strong id="notes">—</strong></article><article class="stat"><span>Suspended accounts</span><strong id="suspended">—</strong></article></section><section class="table-wrap"><div class="table-head"><div><h2>Accounts</h2><p>Private notes are never displayed here.</p></div><button id="refresh">Refresh</button></div><table><thead><tr><th>Person</th><th>Notes</th><th>Joined</th><th>Status</th><th>Controls</th></tr></thead><tbody id="accounts"></tbody></table></section></main>
<script>
const $=s=>document.querySelector(s),escape=v=>String(v).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
async function api(url,options={}){const r=await fetch(url,{...options,headers:{"Content-Type":"application/json",...(options.headers||{})}}),d=r.status===204?null:await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Request failed.");return d}
function row(a){const status=a.isAdmin?"<span class='badge admin'>Administrator</span>":a.isSuspended?"<span class='badge'>Suspended</span>":"<span class='badge active'>Active</span>",controls=a.isAdmin?"Protected":"<div class='actions'><button data-action='"+(a.isSuspended?"restore":"suspend")+"' data-id='"+a.id+"'>"+(a.isSuspended?"Restore":"Suspend")+"</button><button class='danger' data-action='delete' data-id='"+a.id+"'>Delete</button></div>";return "<tr><td><div class='name'>"+escape(a.fullName||"Unnamed")+"</div><div class='email'>"+escape(a.email)+"</div></td><td>"+a.noteCount+"</td><td>"+new Date(a.createdAt).toLocaleDateString()+"</td><td>"+status+"</td><td>"+controls+"</td></tr>"}
async function load(){try{const d=await api("/api/admin/overview");$("#users").textContent=d.stats.userCount;$("#notes").textContent=d.stats.noteCount;$("#suspended").textContent=d.stats.suspendedCount;$("#accounts").innerHTML=d.accounts.map(row).join("")}catch(e){$("#message").textContent=e.message;if(/sign in|administrator|unavailable/i.test(e.message))location.href="sign-in.html"}finally{document.body.classList.remove("loading")}}
$("#accounts").addEventListener("click",async e=>{const b=e.target.closest("button[data-action]");if(!b)return;const action=b.dataset.action,id=b.dataset.id;if(action==="delete"&&!confirm("Delete this account and all of its notes permanently?"))return;if(action==="suspend"&&!confirm("Suspend this account?"))return;b.disabled=true;try{if(action==="delete")await api("/api/admin/accounts/"+id,{method:"DELETE",body:"{}"});else await api("/api/admin/accounts/"+id,{method:"PATCH",body:JSON.stringify({action})});await load()}catch(x){$("#message").textContent=x.message;b.disabled=false}});
$("#refresh").addEventListener("click",load);$("#logout").addEventListener("click",async()=>{await api("/api/auth/logout",{method:"POST",body:"{}"});location.href="/"});load();
</script></body></html>
