services:
  - type: web
    name: memory-keep-note-secure
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/auth/me
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: memory-keep-note-db
          property: connectionString
databases:
  - name: memory-keep-note-db
    databaseName: memory_keep_note
