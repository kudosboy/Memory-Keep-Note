services:
  - type: web
    name: memory-keep-note-secure
    runtime: node
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/auth/me
    envVars:
      - key: NODE_ENV
        value: production
      - key: SESSION_SECRET
        generateValue: true
      - key: MONGODB_URI
        sync: false
      - key: SMTP_URL
        sync: false
