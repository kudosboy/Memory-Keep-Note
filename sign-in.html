<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sign in | Memory Keep Note</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;background:#07070f;color:#f2f3ff;font:16px system-ui,sans-serif}.card{width:min(90vw,400px);padding:28px;border:1px solid #ffffff24;border-radius:20px;background:#17172ad9}input,button{box-sizing:border-box;width:100%;margin-top:10px;padding:12px;border-radius:10px;font:inherit}input{border:1px solid #ffffff33;background:#ffffff0d;color:white}button{border:0;background:linear-gradient(135deg,#8b7bff,#ff5fa8);color:white;font-weight:700;cursor:pointer}p{color:#c9c9dc;line-height:1.5}a{color:#bdb4ff}#message{min-height:22px}</style></head><body><main class="card"><h1>Welcome back</h1><p>Sign in to your secure notes.</p><form id="form"><input id="email" type="email" autocomplete="email" placeholder="Email address" required><input id="password" type="password" autocomplete="current-password" placeholder="Password" required><button>Sign in</button></form><p id="message" role="alert"></p><p><a href="sign-up.html">Create an account</a> · <a href="forgot-password.html">Forgot password?</a></p></main><script>document.querySelector("#form").addEventListener("submit",async e=>{e.preventDefault();const m=document.querySelector("#message");m.textContent="Signing in…";try{const r=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:email.value,password:password.value})}),d=await r.json();if(!r.ok)throw Error(d.error);location.href="/"}catch(e){m.textContent=e.message}})</script></body></html>
