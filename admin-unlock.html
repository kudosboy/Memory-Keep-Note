<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin access | Memory Keep Note</title><link rel="icon" href="/favicon.svg" type="image/svg+xml"><style>body{margin:0;min-height:100vh;display:grid;place-items:center;padding:18px;background:#090812;color:#f5f3ff;font:15px system-ui,sans-serif}.card{width:min(100%,340px);padding:18px;border:1px solid #ffffff22;border-radius:16px;background:#141321c9;box-shadow:0 14px 42px #0008}.mark{display:grid;place-items:center;width:34px;height:34px;border-radius:11px;background:linear-gradient(135deg,#8b7bff,#ff5fa8)}h1{margin:11px 0 5px;font-size:21px}p{color:#bdb8ce;line-height:1.4;font-size:13px}input,button{box-sizing:border-box;width:100%;margin-top:10px;padding:9px;border-radius:9px;font:inherit}input{border:1px solid #ffffff22;background:#ffffff0b;color:white}button{border:0;background:linear-gradient(135deg,#8b7bff,#ff5fa8);color:white;font-weight:700;cursor:pointer}#message{min-height:16px;color:#ffb6c9;font-size:12px}a{color:#c6beff;font-size:12px}</style></head><body><main class="card"><div class="mark">&#128274;</div><h1>Admin access</h1><p>Enter your separate administrator password. You must first be signed in with the configured admin email.</p><form id="form"><input id="password" type="password" autocomplete="current-password" placeholder="Administrator password" required><p id="message" role="alert"></p><button id="submit">Unlock admin panel</button></form><a href="/">← Back to website</a></main><script>document.querySelector("#form").addEventListener("submit",async e=>{e.preventDefault();const message=document.querySelector("#message"),button=document.querySelector("#submit");button.disabled=true;message.textContent="Unlocking…";try{const r=await fetch("/api/admin/unlock",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({password:password.value})});if(!r.ok){const d=await r.json();throw Error(d.error)}location.href="admin.html"}catch(e){message.textContent=e.message;button.disabled=false}})</script></body></html>
